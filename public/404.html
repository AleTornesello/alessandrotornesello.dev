<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="notFound.title">Page not found | Alessandro Tornesello</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <!-- Served at whatever URL was not found, so every path is root-relative. -->
    <script>
        // Same as the inline script in index.html: theme and language before the first paint.
        (() => {
            const root = document.documentElement;
            let saved = {};
            try {
                saved = { theme: localStorage.getItem("theme"), lang: localStorage.getItem("lang") };
            } catch { }

            if (saved.theme === "light" || saved.theme === "dark") root.dataset.theme = saved.theme;

            const supported = ["en", "it"];
            const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
            const lang = supported.includes(saved.lang)
                ? saved.lang
                : preferred.map((l) => String(l).split("-")[0].toLowerCase()).find((l) => supported.includes(l)) ?? "en";
            root.lang = lang;

            if (lang !== "en") {
                root.dataset.i18nPending = "";
                setTimeout(() => delete root.dataset.i18nPending, 2000);
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <script type="module" src="/js/main.js"></script>
    <link rel="icon" href="/assets/favicon/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
</head>

<body>
    <main>
        <section class="section" id="not-found" aria-labelledby="not-found-title">
            <div class="container">
                <div class="section-title">
                    <h1 id="not-found-title" data-i18n="notFound.heading">Page not found</h1>
                </div>
                <p data-i18n="notFound.text">The address you opened doesn't exist or has moved.</p>
                <a class="not-found__home" href="/" data-i18n="notFound.home">Back to home</a>
            </div>
        </section>
    </main>
</body>

</html>
